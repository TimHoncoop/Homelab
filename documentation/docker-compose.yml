services:
  docmost:
    container_name: docmost
    image: docmost/docmost:latest
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: '${DOCMOST_APP_SECRET}'
      DATABASE_URL: '${DOCMOST_DB_URL}'
      REDIS_URL: '${DOCMOST_REDIS_URL}'
    ports:
      - "8075:3000"
    restart: unless-stopped
    volumes:
      - docmost_data:/app/data/storage
  planka:
    container_name: planka
    image: ghcr.io/plankanban/planka:latest
    environment:
      BASE_URL: '${PLANKA_BASE_URL}'
      TRUST_PROXY: '1'
      DATABASE_URL: '${PLANKA_DB_URL}'
      SECRET_KEY: '${PLANKA_APP_SECRET}'
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: '${PLANKA_ADMIN_EMAIL}'
      DEFAULT_ADMIN_PASSWORD: '${PLANKA_ADMIN_PASSWORD}'
      DEFAULT_ADMIN_NAME: 'admin'
    ports:
      - 8076:1337
    restart: unless-stopped
    volumes:
      - planka_data:/app/data

volumes:
  docmost_data:
  planka_data: